aid: aptdeco
name: AptDeco
description: 'AptDeco is a full-service online marketplace for buying and selling used, new, and vintage
  furniture. Founded in 2014 in New York City by Reham Fagiri and Kalam Dennis, the company handles the
  entire resale transaction end to end: pickup, disassembly and assembly, delivery, payment, scheduling,
  and logistics are all carried out by its own trained delivery teams. AptDeco serves the New York City
  metro, New Jersey, Connecticut, Philadelphia, Delaware, and the San Francisco Bay Area, and has
  expanded to additional US metros with national shipping. Backed by Y Combinator and Initialized
  Capital. AptDeco does not publish a public developer API; this profile captures its public web,
  support, legal, and developer surfaces for the API Evangelist network.'
